[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name        = "coxbench"
version     = "0.1.0"
description = "Benchmark harness for coxstream: competing Cox fits, time and memory, paper macros and figures"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
